name: Android Debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK লাইসেন্স
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: ওয়েব গেম বিল্ড
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Capacitor ও Android প্রজেক্ট তৈরি
        run: |
          npm install --no-save @capacitor/core@7 @capacitor/android@7 @capacitor/cli@7
          npx cap add android
          npx cap sync android

      - name: Debug keystore ঠিক করা
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore
          else
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            cp ~/.android/debug.keystore new-debug.keystore
          fi

      - name: APK বিল্ড
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: hashFiles('new-debug.keystore') != ''
        with:
          name: debug-keystore
          path: new-debug.keystore
